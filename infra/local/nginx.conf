# Gateway local mínimo (no Supabase hospedado, quem faz isso é o Kong). Uma única origem: /auth/v1, /rest/v1, /realtime/v1.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8000;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, accept-profile, content-profile, range, x-supabase-api-version" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  if ($request_method = OPTIONS) { return 204; }

  # O DNS interno do Docker é consultado a cada poucos segundos: reiniciar um serviço (novo IP) não derruba o gateway.
  resolver 127.0.0.11 valid=3s ipv6=off;

  # Todos os clientes chegam ao Auth com o mesmo endereço (a rede da escola atrás de um único IP).
  location /auth/v1/ {
    set $auth_up http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth_up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /rest/v1/ {
    set $rest_up http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_up;
    proxy_set_header Host $host;
  }
  location /realtime/v1/ {
    set $rt_up http://realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $rt_up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.supabase-realtime;
  }
}
